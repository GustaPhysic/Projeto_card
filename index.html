<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body{
            background: linear-gradient(-45deg,white,rgb(106, 174, 206),black);
            background-size: 400% 400%;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            color: aliceblue;
            animation: gradientBG 10s ease infinite;


           }
           
        @keyframes gradientBG{
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        
       .card{
        background-color: rgb(31, 30, 30);
        padding: 20px;
        border-radius: 12px;
        width: 400px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0.760, 0.760)
       }
       .imgperfil{
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 5px solid rgb(98, 145, 165);
        margin-bottom: 5px;
        object-fit: fill;

       }
       h2{
        margin: 10px 0 5px;
        font-size: 27px;
       }
       .local{
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 10px;
       }
       .job{
        font-size: 16px;
        line-height: 1.5;
       }
       .botoes{
        margin: 20px 0;
        display: flex;
        justify-content: center;
        gap: 10px;
       }

       .btn{
        color: aliceblue;
        background-color: rgb(173, 208, 231);
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 6px;
        border: 1px solid rgb(113, 189, 240);
        cursor: pointer;
        font-size: 15px;
        transition: 0.3s;
       }

       .btn:hover{
        opacity: 0.8;
        background: rgb(60, 120, 160);
       }

       .skills{
        margin-top: 12px;
        text-align: left;
        }

        .skills h3{
            font-size: 20px;
            margin-bottom: 10px;
        }

        .tags{
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag{

            border: 1px solid rgb(248, 246, 246);
            padding: 5px 5px;
            border-radius: 4px;

        }

        .social-media{
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 20px;
        }

        .social-media i{
            color: rgb(96, 153, 204);
            cursor: pointer;
            transition: 0.3s;

        }
        .social-media i:hover{
            color: blue;
            transform: scale(1.2);
        }
        .social-media a{
            text-decoration: none;
            color: rgb(83, 156, 224);
            
        }
        .social-media a:hover{
            color: blue;
            transform: scale(1.2);

        }
    </style>
</head>
<body>
    <div class="card">
        <img src="foto-perfil.png" alt="Foto de Perfil" class="imgperfil">
        <h2>Gustavo Rodrigues Santos</h2>
        <div class="local">Montes Claros - MG</div>
        <div class="job">Técnico em Informática<br>Estudante de Tecnologia</div>
         
        <div class="botoes">
            <a  href="https://wa" class="btn primario">Mensagem</a>
            <a  href="#" class="btn secundario">Follow</a>
        </div>
         <div class="skills">
            <h3>Habilidades</h3>
            <div class="tags">
                <span class="tag">Conhecimento de Hardware</span><br>
                <span class="tag">Proatividade em Grupo</span><br>
                <span class="tag">Conhecimento de Redes</span><br>
                <span class="tag">Python</span><br>
                <span class="tag">HTML</span><br>
                <span class="tag">Eficiência em Exatas</span><br>
                <span class="tag">Análise de dados</span><br>
                <span class="tag">Linux</span>
            </div>
         </div><br>

         <div class="social-media">
            <a href="https://github.com/GustaPhysic"><i class="fab fa-github"></i></a>
            <a href="https://www.linkedin.com/in/gustavo-r-3583713b3/"> <i class="fab fa-linkedin"></i></a>
           <a href="https://www.instagram.com/gus_lwzx/"><i class="fab fa-instagram"></i></a>

         </div>
    </div>
    
</body>
</html>
